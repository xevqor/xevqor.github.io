<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>XEVQOR JWT · TOKEN INSPECTOR</title>

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@200;300;400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #000000;
      --card: #050505;
      --platinum: #e8ebf2;
      --platinum-glow: rgba(220, 225, 240, 0.15);
      --ice: #ffffff;
      --alert: #ff4d4d;
      --ok: #4dff88;
      --silver: #8a8c92;
      --border: #1a1a1c;
      --input-bg: #000000;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0; min-height: 100dvh;
      background: #000000;
      font-family: 'Montserrat', sans-serif;
      display: flex; align-items: center; justify-content: center;
      color: #f5f5f7; padding: 15px; overflow: auto; position: relative;
    }

    /* Ambient glow elegan */
    body::before {
      content: "";
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(100vw, 800px); height: min(80vh, 700px);
      background: radial-gradient(ellipse at center, rgba(220, 225, 240, 0.05) 0%, transparent 70%);
      filter: blur(50px); z-index: 0; pointer-events: none;
    }

    .vault {
      width: 100%; max-width: 750px;
      background: var(--card); padding: 1.8rem;
      border-radius: 1.5rem; border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex; flex-direction: column; position: relative; z-index: 1;
    }

    .header-line {
      width: 100%; height: 1px; margin-bottom: 1.2rem;
      background: linear-gradient(90deg, transparent, var(--platinum), transparent);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    h1 {
      margin: 0; font-family: 'Cinzel', serif; font-weight: 500; font-size: 2rem; letter-spacing: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #a8adb8 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; text-transform: uppercase;
    }

    #jwtClock {
      text-align: center; font-size: 0.55rem; color: var(--silver); letter-spacing: 3px;
      margin-top: 8px; font-weight: 500; text-transform: uppercase;
    }

    .main-area { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }

    textarea {
      width: 100%; height: 100px; background: var(--input-bg); border: 1px solid #222;
      color: var(--platinum); padding: 1rem; border-radius: 1rem; resize: vertical;
      font-size: 0.85rem; line-height: 1.5; outline: none; transition: 0.3s ease;
      font-family: 'Fira Code', 'Montserrat', monospace; word-break: break-all;
    }
    textarea::placeholder { color: #444; font-weight: 300; letter-spacing: 1px; font-family: 'Montserrat', sans-serif; }
    textarea:focus { border-color: var(--platinum); box-shadow: 0 0 20px var(--platinum-glow); }

    .btn-group { display: flex; gap: 10px; }

    button.action-btn {
      flex: 1; padding: 0.9rem 0; background: transparent; border-radius: 2rem;
      font-weight: 500; cursor: pointer; text-transform: uppercase; letter-spacing: 1.5px;
      transition: 0.3s ease; font-size: 0.65rem; outline: none; border: 1px solid #333; color: var(--platinum);
    }
    button:active { transform: translateY(1px); }

    .btn-decode { border-color: rgba(255, 255, 255, 0.3); color: var(--ice); }
    .btn-decode:hover {
      background: rgba(255, 255, 255, 0.03); border-color: var(--platinum); color: #fff;
      box-shadow: 0 0 20px var(--platinum-glow);
    }

    .btn-clear { border-color: rgba(255, 77, 77, 0.4); color: var(--alert); width: 30%; flex: none; }
    .btn-clear:hover { background: rgba(255, 77, 77, 0.1); border-color: var(--alert); color: #fff; box-shadow: 0 0 20px rgba(255, 77, 77, 0.2); }

    /* Result Area */
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem; }
    @media (max-width: 600px) { .result-grid { grid-template-columns: 1fr; } }

    .res-box {
      background: var(--input-bg); border: 1px solid #222; border-radius: 1rem;
      padding: 1rem; display: flex; flex-direction: column;
    }

    .res-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .res-title { font-size: 0.65rem; color: var(--silver); text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }
    
    .btn-copy-small {
      background: transparent; border: 1px solid #333; color: var(--silver);
      font-size: 0.55rem; padding: 4px 10px; border-radius: 1rem; cursor: pointer;
      text-transform: uppercase; letter-spacing: 1px; transition: 0.2s;
    }
    .btn-copy-small:hover { border-color: var(--platinum); color: var(--platinum); }

    pre {
      margin: 0; font-family: 'Fira Code', monospace; font-size: 0.75rem; line-height: 1.5;
      color: var(--platinum); white-space: pre-wrap; word-wrap: break-word; overflow-y: auto; max-height: 200px;
    }

    .status-bar {
      font-size: 0.55rem; color: #444; margin-top: 1.5rem; display: flex;
      justify-content: space-between; border-top: 1px solid #111;
      padding-top: 1rem; letter-spacing: 2px; text-transform: uppercase;
    }
    #status { font-weight: 600; color: var(--silver); }

    /* Expiry Badge */
    #expiryBadge {
      display: none; text-align: center; padding: 8px; border-radius: 1rem;
      font-size: 0.65rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px;
    }
    .exp-valid { display: block !important; background: rgba(77, 255, 136, 0.1); color: var(--ok); border: 1px solid rgba(77, 255, 136, 0.3); }
    .exp-invalid { display: block !important; background: rgba(255, 77, 77, 0.1); color: var(--alert); border: 1px solid rgba(255, 77, 77, 0.3); }

    /* Scrollbar */
    pre::-webkit-scrollbar { width: 4px; }
    pre::-webkit-scrollbar-thumb { background: var(--silver); border-radius: 10px; }
  </style>
</head>
<body>

<div class="vault">
  <div class="header-line"></div>
  <h1>XEVQOR JWT</h1>
  <div id="jwtClock">SYNCING...</div>

  <div class="main-area">
    <textarea id="jwtInput" placeholder="Paste your JWT (Header.Payload.Signature) here..."></textarea>
    
    <div class="btn-group">
      <button class="action-btn btn-decode" onclick="decodeJWT()">DECODE TOKEN</button>
      <button class="action-btn btn-clear" onclick="clearAll()">CLEAR</button>
    </div>

    <div id="expiryBadge"></div>

    <div class="result-grid">
      <div class="res-box">
        <div class="res-header">
          <span class="res-title">Header</span>
          <button class="btn-copy-small" onclick="copyText('headerOut')">COPY</button>
        </div>
        <pre id="headerOut">Waiting...</pre>
      </div>

      <div class="res-box">
        <div class="res-header">
          <span class="res-title">Payload</span>
          <button class="btn-copy-small" onclick="copyText('payloadOut')">COPY</button>
        </div>
        <pre id="payloadOut">Waiting...</pre>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span>CLIENT-SIDE PARSER</span>
    <span id="status">READY</span>
  </div>
</div>

<script>
  function updateClock() {
    const now = new Date();
    const timeStr = now.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('jwtClock').innerText = timeStr.toUpperCase();
  }
  setInterval(updateClock, 1000); updateClock();

  function updateStatus(msg, color) {
    const s = document.getElementById("status");
    s.innerText = msg;
    s.style.color = color || "var(--silver)";
  }

  // Fungsi Base64Url Decode
  function base64UrlDecode(str) {
    let base64 = str.replace(/-/g, '+').replace(/_/g, '/');
    while (base64.length % 4) {
      base64 += '=';
    }
    return decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
  }

  function decodeJWT() {
    const token = document.getElementById('jwtInput').value.trim();
    const headerOut = document.getElementById('headerOut');
    const payloadOut = document.getElementById('payloadOut');
    const badge = document.getElementById('expiryBadge');

    if (!token) {
      updateStatus("TOKEN REQUIRED", "var(--alert)");
      return;
    }

    const parts = token.split('.');
    if (parts.length !== 3) {
      updateStatus("INVALID FORMAT", "var(--alert)");
      headerOut.innerText = "Invalid JWT format.";
      payloadOut.innerText = "Ensure token has 3 parts separated by dots.";
      badge.className = "";
      return;
    }

    try {
      updateStatus("PARSING...", "var(--platinum)");

      // Decode Header & Payload
      const headerRaw = base64UrlDecode(parts[0]);
      const payloadRaw = base64UrlDecode(parts[1]);

      const headerJson = JSON.parse(headerRaw);
      const payloadJson = JSON.parse(payloadRaw);

      headerOut.innerText = JSON.stringify(headerJson, null, 2);
      payloadOut.innerText = JSON.stringify(payloadJson, null, 2);

      // Cek Expiry (exp claim)
      if (payloadJson.exp) {
        const expDate = new Date(payloadJson.exp * 1000);
        const now = new Date();
        
        if (expDate > now) {
          badge.innerText = "🟢 TOKEN IS VALID until " + expDate.toLocaleString();
          badge.className = "exp-valid";
        } else {
          badge.innerText = "🔴 TOKEN IS EXPIRED on " + expDate.toLocaleString();
          badge.className = "exp-invalid";
        }
      } else {
        badge.innerText = "⚪ NO EXPIRY CLAIM FOUND";
        badge.className = "exp-valid"; // Pake style valid biar rapi, atau bikin style baru
        badge.style.background = "rgba(255,255,255,0.05)";
        badge.style.color = "var(--silver)";
        badge.style.border = "1px solid #333";
      }

      updateStatus("DECODE SUCCESS", "var(--ok)");
      headerOut.style.color = "var(--platinum)";
      payloadOut.style.color = "var(--platinum)";

    } catch (e) {
      updateStatus("DECODE FAILED", "var(--alert)");
      headerOut.innerText = "Failed to parse Header.";
      payloadOut.innerText = "Failed to parse Payload.";
      badge.className = "";
    }
  }

  function copyText(elementId) {
    const text = document.getElementById(elementId).innerText;
    if (!text || text === "Waiting...") return;

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => {
        updateStatus("COPIED!", "var(--ice)");
        setTimeout(() => updateStatus("READY", "var(--silver)"), 2000);
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const dummy = document.createElement("textarea");
    document.body.appendChild(dummy);
    dummy.value = text;
    dummy.select();
    document.execCommand("copy");
    document.body.removeChild(dummy);
    updateStatus("COPIED!", "var(--ice)");
    setTimeout(() => updateStatus("READY", "var(--silver)"), 2000);
  }

  function clearAll() {
    document.getElementById('jwtInput').value = "";
    document.getElementById('headerOut').innerText = "Waiting...";
    document.getElementById('payloadOut').innerText = "Waiting...";
    const badge = document.getElementById('expiryBadge');
    badge.className = "";
    updateStatus("WIPED", "var(--alert)");
    setTimeout(() => updateStatus("READY", "var(--silver)"), 1500);
  }
</script>
</body>
</html>
