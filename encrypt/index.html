<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>XEVQOR ENCRYPTION | PLATINUM VAULT</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Fonts: Cinzel & Montserrat -->

  <style>
    :root {
      --platinum: #e8ebf2;
      --platinum-glow: rgba(220, 225, 240, 0.15);
      --ice: #ffffff;
      --alert: #ff4d4d;
      --silver: #8a8c92;
      --border: #1a1a1c;
      --input-bg: #000000;
      --card: #050505;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      background: #000000;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, sans-serif;
      padding: 15px;
      color: #f5f5f7;
      position: relative;
      overflow: auto;
    }

    /* Ambient glow elegan di belakang card */
    body::before {
      content: "";
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(100vw, 600px); height: min(80vh, 600px);
      background: radial-gradient(ellipse at center, rgba(220, 225, 240, 0.05) 0%, transparent 70%);
      filter: blur(50px); z-index: 0; pointer-events: none;
    }

    .vault-card {
      max-width: 520px;
      width: 100%;
      background: var(--card);
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
      padding: 1.8rem;
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .header-ambient {
      width: 100%;
      height: 1px;
      margin: 0 auto 1.2rem auto;
      background: linear-gradient(90deg, transparent, var(--platinum), transparent);
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    h1 {
      font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif, serif;
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: 5px;
      text-align: center;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #a8adb8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .clock-wrapper { text-align: center; margin-bottom: 1.5rem; }
    
    #clock {
      font-size: 0.55rem;
      color: var(--silver);
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-bottom: 1px solid #111;
      display: inline-block;
      padding-bottom: 0.5rem;
    }

    .dropzone {
      background: var(--input-bg);
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 1rem;
      padding: 1.2rem;
      text-align: center;
      font-size: 0.65rem;
      color: var(--silver);
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 0.8rem;
    }

    .dropzone:hover, .dropzone.active {
      border-color: var(--platinum);
      color: var(--platinum);
      box-shadow: 0 0 20px var(--platinum-glow);
    }
    
    .dropzone.active { border-style: solid; }

    .filename {
      font-size: 0.65rem;
      text-align: center;
      color: var(--ice);
      margin-top: 0.3rem;
      opacity: 0;
      transition: 0.2s;
      font-weight: 500;
      letter-spacing: 1px;
    }
    .filename.show { opacity: 1; }
    
    input[type="file"] { display: none; }

    .input-field {
      margin-top: 1rem;
      position: relative;
    }

    .input-field input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid #222;
      border-radius: 1rem;
      padding: 0.9rem 1.2rem;
      color: var(--platinum);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, monospace;
      font-size: 0.8rem;
      letter-spacing: 2px;
      outline: none;
      transition: 0.3s ease;
      text-align: center;
    }
    
    .input-field input::placeholder { color: #444; font-weight: 300; letter-spacing: 1px; }

    .input-field.active input, .input-field input:focus {
      border-color: var(--platinum);
      box-shadow: 0 0 20px var(--platinum-glow);
    }

    .eye {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      opacity: 0.4;
      color: var(--silver);
      transition: 0.2s;
    }
    .eye:hover { opacity: 1; color: var(--platinum); }

    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 1.5rem 0 1rem;
    }

    button {
      background: transparent;
      border: 1px solid #333;
      padding: 0.9rem;
      border-radius: 2rem;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, sans-serif;
      font-weight: 500;
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--platinum);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    button:hover {
      background: rgba(255,255,255,0.03);
      color: #fff;
      border-color: var(--platinum);
      transform: translateY(-2px);
      box-shadow: 0 0 20px var(--platinum-glow);
    }

    .wipe-btn {
      width: 100%;
      border-color: rgba(255, 77, 77, 0.4);
      color: var(--alert);
      margin-top: 0.2rem;
    }
    
    .wipe-btn:hover {
      background: rgba(255, 77, 77, 0.1);
      border-color: var(--alert);
      color: #fff;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.2);
    }

    .progress-bar {
      height: 2px;
      background: #111;
      border-radius: 3px;
      margin-top: 1.5rem;
      overflow: hidden;
      display: none;
    }
    
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--platinum), var(--ice));
      transition: width 0.1s linear;
      box-shadow: 0 0 10px var(--platinum-glow);
    }

    .status {
      text-align: center;
      font-size: 0.6rem;
      margin-top: 1.2rem;
      color: var(--silver);
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    
    .percent {
      text-align: center;
      font-size: 0.55rem;
      margin-top: 0.3rem;
      color: var(--platinum);
      letter-spacing: 1px;
      font-weight: 600;
    }

    footer {
      text-align: center;
      font-size: 0.55rem;
      margin-top: 1.5rem;
      color: #333;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 1px solid #111;
      padding-top: 1rem;
    }
  </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="referrer" content="no-referrer" />
</head>
<body>
<div class="vault-card">
  <div class="header-ambient"></div>
  <h1>XEVQOR ENCRYPT</h1>
  <div class="clock-wrapper"><span id="clock"></span></div>
  
  <div class="dropzone" id="drop">⟡ DROP FILE OR TAP TO SELECT ⟡</div>
  <div class="filename" id="fname"></div>
  <input type="file" id="file">
  
  <div class="input-field" id="box1">
    <input type="password" id="pass" placeholder="MASTER PASSPHRASE">
    <span class="eye" onclick="toggle('pass')">👁</span>
  </div>
  <div class="input-field" id="box2">
    <input type="password" id="pass2" placeholder="CONFIRM PASSPHRASE">
    <span class="eye" onclick="toggle('pass2')">👁</span>
  </div>
  
  <div class="btn-group">
    <button onclick="run('enc')">ENCRYPT</button>
    <button onclick="run('dec')">DECRYPT</button>
  </div>
  
  <button class="wipe-btn" onclick="wipe()">WIPE SYSTEM</button>
  
  <div class="progress-bar" id="bar"><div class="progress-fill" id="fill"></div></div>
  <div class="status" id="status">IDLE</div>
  <div class="percent" id="percent"></div>
  
  <footer>XEVQOR • PLATINUM VAULT • AES-256</footer>
</div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const fname = document.getElementById('fname');
  const box1 = document.getElementById('box1');
  const box2 = document.getElementById('box2');
  const pass = document.getElementById('pass');
  const pass2 = document.getElementById('pass2');
  const statusDiv = document.getElementById('status');
  const percentDiv = document.getElementById('percent');
  const fillDiv = document.getElementById('fill');
  const barDiv = document.getElementById('bar');

  function typeText(el, text) {
    let i = 0; el.placeholder = "";
    let int = setInterval(() => {
      if (i < text.length) { el.placeholder += text.charAt(i); i++; } else clearInterval(int);
    }, 20);
  }
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    let f = fileInput.files[0];
    if (f) {
      drop.classList.add('active');
      fname.innerText = f.name;
      fname.classList.add('show');
      box1.classList.add('active');
      typeText(pass, "INSERT PASSPHRASE");
      setTimeout(() => { box2.classList.add('active'); typeText(pass2, "VERIFY PASSPHRASE"); }, 600);
    }
  };
  function toggle(id) { let e = document.getElementById(id); e.type = e.type === 'password' ? 'text' : 'password'; }
  function updateClock() { document.getElementById('clock').innerText = new Date().toUTCString(); }
  setInterval(updateClock, 1000); updateClock();
  let jobId = 0;
  function wipe() {
    jobId++;
    fileInput.value = ""; fname.innerText = ""; fname.classList.remove('show'); drop.classList.remove('active');
    box1.classList.remove('active'); box2.classList.remove('active'); pass.value = ""; pass2.value = "";
    statusDiv.innerText = "IDLE"; percentDiv.innerText = ""; barDiv.style.display = "none"; fillDiv.style.width = "0%";
  }
  const CHUNK_SIZE = 10 * 1024 * 1024;
  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  }
  async function run(mode) {
    const myJob = ++jobId;
    const file = fileInput.files[0];
    const p = pass.value, p2 = pass2.value;
    if (!file || !p) return alert("INVALID INPUT");
    if (mode === 'enc' && p !== p2) return alert("VERIFY FAILED");
    let offset = 0, key, salt, outputChunks = [];
    statusDiv.innerText = "PROCESSING"; barDiv.style.display = "block";
    try {
      const aadChunk=(i,last)=>{const b=new Uint8Array(5);new DataView(b.buffer).setUint32(0,i,true);b[4]=last?1:0;return b;};
      const metaAad=new TextEncoder().encode("XQR2:META");
      if (mode === 'enc') {
        salt = crypto.getRandomValues(new Uint8Array(16));
        key = await deriveKey(p, salt);
        outputChunks.push(new TextEncoder().encode("XQR2"), salt);
        const metaBytes = new TextEncoder().encode(JSON.stringify({ name: file.name, size: file.size }));
        const metaIv = crypto.getRandomValues(new Uint8Array(12));
        const metaEnc = await crypto.subtle.encrypt({ name: "AES-GCM", iv: metaIv, additionalData: metaAad }, key, metaBytes);
        const lenBuf = new ArrayBuffer(4); new DataView(lenBuf).setUint32(0, metaEnc.byteLength, true);
        outputChunks.push(metaIv, new Uint8Array(lenBuf), new Uint8Array(metaEnc));
        let idx = 0;
        while (offset < file.size) {
          if (myJob !== jobId) { outputChunks.length = 0; return; }
          const slice = file.slice(offset, offset + CHUNK_SIZE);
          const isLast = (offset + CHUNK_SIZE >= file.size);
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv, additionalData: aadChunk(idx++, isLast) }, key, await slice.arrayBuffer());
          outputChunks.push(iv, new Uint8Array(encrypted));
          if (myJob !== jobId) { outputChunks.length = 0; return; }
          offset += CHUNK_SIZE;
          let pct = Math.min(100, Math.floor(offset / file.size * 100));
          fillDiv.style.width = pct + "%"; percentDiv.innerText = pct + "%";
        }
      } else {
        const header = new TextDecoder().decode(await file.slice(0,4).arrayBuffer());
        if (header !== "XQR2") throw "INVALID SIGNATURE";
        salt = new Uint8Array(await file.slice(4,20).arrayBuffer());
        key = await deriveKey(p, salt);
        offset = 20;
        const metaIv = new Uint8Array(await file.slice(offset, offset+12).arrayBuffer()); offset+=12;
        const lenBuf = await file.slice(offset, offset+4).arrayBuffer();
        const metaLen = new DataView(lenBuf).getUint32(0,true); offset+=4;
        const metaEnc = await file.slice(offset, offset+metaLen).arrayBuffer(); offset+=metaLen;
        const metaDec = await crypto.subtle.decrypt({ name:"AES-GCM", iv:metaIv, additionalData: metaAad }, key, metaEnc);
        const metaObj = JSON.parse(new TextDecoder().decode(metaDec)); const metaName = metaObj.name; let totalDecrypted = 0;
        let idx = 0;
        while (offset < file.size) {
          if (myJob !== jobId) { outputChunks.length = 0; return; }
          const iv = new Uint8Array(await file.slice(offset, offset+12).arrayBuffer()); offset+=12;
          let ctSize = Math.min(CHUNK_SIZE+16, file.size-offset);
          const isLast = (offset + ctSize >= file.size);
          const ct = await file.slice(offset, offset+ctSize).arrayBuffer(); offset+=ctSize;
          const decrypted = await crypto.subtle.decrypt({ name:"AES-GCM", iv, additionalData: aadChunk(idx++, isLast) }, key, ct);
          outputChunks.push(new Uint8Array(decrypted)); totalDecrypted += decrypted.byteLength;
          if (myJob !== jobId) { outputChunks.length = 0; return; }
          let pct = Math.min(100, Math.floor(offset / file.size * 100));
          fillDiv.style.width = pct + "%"; percentDiv.innerText = pct + "%";
        }
        if (typeof metaObj.size === 'number' && totalDecrypted !== metaObj.size) throw 'TRUNCATED'; var original = metaName || file.name.replace(/\.xqr$/,'');
      }
      if (myJob !== jobId) { outputChunks.length = 0; return; }
      const blob = new Blob(outputChunks, {type:"application/octet-stream"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      if (mode === 'enc') { let base = file.name.replace(/\.[^/.]+$/,''); a.download = base + ".xqr"; }
      else { a.download = "xevqor." + original; }
      a.click(); statusDiv.innerText = "SUCCESS"; fillDiv.style.background = "linear-gradient(90deg, #e8ebf2, #ffffff)";
    } catch(e) { statusDiv.innerText = "FAIL / WRONG KEY"; fillDiv.style.background = "#ff4d4d"; }
  }
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
</script>
</body>
</html>
