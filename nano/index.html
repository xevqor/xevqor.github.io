    #xqrClock {

        margin-top: 8px; font-weight: 500; text-transform: uppercase;
    }

    .main-area { display: flex; flex-direction: column; gap: 12px; margin-top: 1.5rem; }

    textarea { 
        width: 100%; height: 140px; background: var(--input-bg); border: 1px solid #222; 
        color: var(--platinum); padding: 1rem; border-radius: 1rem; resize: none; 
        font-size: 0.85rem; line-height: 1.5; 
        outline: none; transition: 0.3s ease; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, monospace;
    }
    textarea::placeholder { color: #444; font-weight: 300; letter-spacing: 1px; }
    textarea:focus { border-color: var(--platinum); box-shadow: 0 0 20px rgba(255,255,255,0.1); }

    .pass-wrapper { position: relative; width: 100%; }
    
    input.pass-input { 
        width: 100%; padding: 0.9rem 1rem; background: var(--input-bg); 
        border: 1px solid #222; color: var(--ice); border-radius: 1rem; 
        text-align: center; letter-spacing: 4px; outline: none; 
        transition: 0.3s ease; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, monospace; font-size: 0.9rem;
    }
    input::placeholder { color: #444; font-weight: 300; letter-spacing: 1px; }
    input:focus { border-color: var(--platinum); box-shadow: 0 0 20px rgba(255,255,255,0.1); }

    .eye-btn {
        position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
        background: transparent; border: none; color: var(--silver); cursor: pointer;
        font-size: 1rem; outline: none; opacity: 0.5; transition: 0.3s;
    }
    .eye-btn:hover { opacity: 1; color: var(--platinum); }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

    button.action-btn { 
        flex: 1; min-width: 80px; padding: 0.9rem 0; background: transparent; 
        border-radius: 2rem; font-weight: 500; cursor: pointer; 
        text-transform: uppercase; letter-spacing: 1.5px; transition: 0.3s ease; 
        font-size: 0.65rem; outline: none; border: 1px solid #333; color: var(--platinum);
    }
    button:active { transform: translateY(1px); }

    .btn-enc { border-color: rgba(255,255,255,0.15); }
    .btn-dec { border-color: rgba(255,255,255,0.15); }

    .action-row { display: flex; gap: 10px; width: 100%; margin-top: 6px; }
    .btn-copy { border-color: rgba(255,255,255,0.1); flex: 1; }
    .btn-wipe { border-color: rgba(255, 77, 77, 0.4); color: var(--alert); flex: 1; }

    button:hover { 
        background: rgba(255,255,255,0.03); border-color: var(--platinum); color: #fff; 
        box-shadow: 0 0 20px rgba(255,255,255,0.1); transform: translateY(-2px);
    }
    
    .btn-wipe:hover { 
        background: rgba(255, 77, 77, 0.1); border-color: var(--alert); color: #fff; 
        box-shadow: 0 0 20px rgba(255, 77, 77, 0.2); 
    }

    .footer-status { 
        font-size: 0.55rem; color: #444; margin-top: 1.5rem; display: flex; 
        justify-content: space-between; border-top: 1px solid #111; 
        padding-top: 1rem; letter-spacing: 2px; text-transform: uppercase; 
    }
    #status { font-weight: 600; color: var(--silver); }

    @media (max-width: 500px) {
        .box { padding: 1.2rem; }
        h2 { font-size: 1.4rem; letter-spacing: 4px; }
        button.action-btn { font-size: 0.6rem; padding: 0.7rem 0; }
    }

<script>
    function updateClock() {
        const now = new Date();
        const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

        const dayName = days[now.getDay()];
        const day = now.getDate();
        const month = months[now.getMonth()];
        const year = now.getFullYear();

        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; 

        const timeStr = `${dayName}, ${month} ${day} ${year} | ${hours}:${minutes}:${seconds} ${ampm}`;
        document.getElementById('xqrClock').innerText = timeStr;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function togglePass() {
        const p = document.getElementById("pass");
        const i = document.getElementById("eyeIcon");
        if (p.type === "password") { p.type = "text"; i.innerText = "🔒"; } 
        else { p.type = "password"; i.innerText = "👁️"; }
    }

    function updateStatus(msg, color) {
        const s = document.getElementById("status");
        s.innerText = msg;
        s.style.color = color || "#b8c7d9";
    }

    async function compress(str) {
        const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));
        return new Uint8Array(await new Response(stream).arrayBuffer());
    }

    async function decompress(bytes) {
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        return await new Response(stream).text();
    }

    async function deriveKey(p,salt){const enc=new TextEncoder();const km=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
    async function process(mode){const p=document.getElementById('pass').value,msgEl=document.getElementById('msg'),m=mode==='enc'?msgEl.value:msgEl.value.trim();if(!p||!m){alert("PASSKEY & MESSAGE REQUIRED.");return;}updateStatus("PROCESSING...","#b8c7d9");try{if(mode==='enc'){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(p,salt),cd=await compress(m),enc=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,cd),c=new Uint8Array(28+enc.byteLength);c.set(salt,0);c.set(iv,16);c.set(new Uint8Array(enc),28);let b='';for(let x of c)b+=String.fromCharCode(x);msgEl.value=btoa(b);updateStatus("SQUEEZE SUCCESS","#6bcf9f");}else{const raw=atob(m),c=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)c[i]=raw.charCodeAt(i);if(c.length<29)throw 1;const key=await deriveKey(p,c.slice(0,16)),dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:c.slice(16,28)},key,c.slice(28));msgEl.value=await decompress(new Uint8Array(dec));updateStatus("DECOMPRESS SUCCESS","#9aaebf");}}catch(e){updateStatus("ACCESS DENIED","#ff6b6b");alert("FAILURE: INCORRECT PASSKEY OR INVALID FORMAT.");}}

    function copyToClipboard() {
        const text = document.getElementById('msg').value;
        if(!text) return updateStatus("EMPTY VAULT", "#ff6b6b");

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => { finishCopy(); }).catch(() => bruteForceCopy(text));
        } else { bruteForceCopy(text); }
    }

    function bruteForceCopy(text) {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = text;
        dummy.select();
        dummy.setSelectionRange(0, 99999);
        try { document.execCommand("copy"); finishCopy(); } 
        catch (err) { alert("Copy failed. Please copy manually."); }
        document.body.removeChild(dummy);
    }

    function finishCopy() {
        updateStatus("COPIED!", "#b8c7d9");
        setTimeout(() => updateStatus("READY", "#b8c7d9"), 2000);
    }

    function clearAll() {
        document.getElementById('msg').value = "";
        document.getElementById('pass').value = "";
        updateStatus("WIPED", "#ff6b6b");
        setTimeout(() => updateStatus("READY", "#b8c7d9"), 1500);
    }
</script>
