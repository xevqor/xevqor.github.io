<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>XEVQOR CIPHERLINK · SERVERLESS</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <!-- Fonts: Cinzel untuk judul, Montserrat untuk teks -->

  <style>
    :root {
      --bg: #000000;
      --card: #050505;
      --platinum: #e8ebf2;
      --platinum-glow: rgba(220, 225, 240, 0.15);
      --ice: #ffffff;
      --silver: #8a8c92;
      --alert: #ff4d4d;
      --ok: #4dff88;
      --border: #1a1a1c;
      
      --input-bg: #000000;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0; min-height: 100dvh;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, sans-serif;
      display: flex; align-items: center; justify-content: center;
      color: #f5f5f7; padding: 15px; overflow: auto; position: relative;
    }

    /* Ambient glow elegan di belakang card */
    body::before {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, 600px);
      height: min(80vh, 600px);
      background: radial-gradient(ellipse at center, rgba(220, 225, 240, 0.05) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    .vault {
      width: 100%; max-width: 520px; background: var(--card);
      padding: 1.8rem; border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
      display: flex; flex-direction: column; position: relative; z-index: 1;
    }

    .header-ambient {
      width: 100%; height: 1px; margin-bottom: 1.2rem;
      background: linear-gradient(90deg, transparent, var(--platinum), transparent);
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    h1 {
      margin: 0; font-size: 2rem; font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif, serif; font-weight: 500; letter-spacing: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #a8adb8 100%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; text-transform: uppercase;
    }
    
    #nexusClock {
      text-align: center; font-size: 0.55rem; color: var(--silver); letter-spacing: 3px;
      margin-top: 8px; font-weight: 500; text-transform: uppercase;
    }

    .main-area { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
    
    /* Textarea dan Input dibikin hitam pekat elegan */
    textarea {
      width: 100%; background: var(--input-bg); border: 1px solid #222;
      color: var(--platinum); padding: 1.2rem; border-radius: 1rem;
      font-size: 0.95rem; font-weight: 400; line-height: 1.6; outline: none; transition: 0.3s;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, monospace; height: 120px; resize: vertical;
    }
    textarea::placeholder { color: #444; font-weight: 300; letter-spacing: 1px; }
    textarea:focus { border-color: var(--platinum); box-shadow: 0 0 20px var(--platinum-glow); }
    
    input {
      width: 100%; background: var(--input-bg); border: 1px solid #222;
      color: var(--ice); padding: 0.9rem 1rem; border-radius: 1rem; font-size: 0.85rem;
      line-height: 1.5; outline: none; transition: 0.3s; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, monospace;
    }
    input:focus { border-color: var(--platinum); box-shadow: 0 0 20px var(--platinum-glow); }
    
    .pass-wrapper { position: relative; width: 100%; }
    input.pass-input { text-align: center; letter-spacing: 4px; }
    .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: var(--silver); cursor: pointer;
      font-size: 1rem; opacity: 0.5; outline: none; transition: 0.2s;
    }
    .eye-btn:hover { opacity: 1; color: var(--platinum); }

    /* Tombol dengan gaya elegan */
    button.btn-exec {
      width: 100%; padding: 1rem; background: transparent; border: 1px solid #333;
      color: var(--platinum); font-weight: 500; cursor: pointer; text-transform: uppercase;
      letter-spacing: 2px; transition: 0.3s ease; font-size: 0.75rem; outline: none;
      border-radius: 2rem;
    }
    button.btn-exec:hover {
      border-color: var(--platinum); background: rgba(255,255,255,0.03); color: #fff; 
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    /* Tombol bahaya (Merah Elegan) */
    .btn-red { border-color: rgba(255, 77, 77, 0.4) !important; color: var(--alert) !important; }
    .btn-red:hover { background: rgba(255, 77, 77, 0.1) !important; border-color: var(--alert) !important; color: #fff !important; box-shadow: 0 0 20px rgba(255, 77, 77, 0.2) !important; }

    #resultArea { margin-top: 1.2rem; display: none; text-align: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.2rem; }
    
    .link-box { 
      background: #000; border: 1px dashed rgba(255,255,255,0.2); padding: 1rem; 
      font-size: 0.75rem; word-break: break-all; margin-bottom: 1rem; color: var(--silver); 
      border-radius: 1rem; font-family: monospace; line-height: 1.5;
    }

    .action-row { display: flex; gap: 10px; margin-top: 0.8rem; }
    .btn-util { 
      flex: 1; padding: 0.8rem; background: transparent; color: var(--silver); 
      border: 1px solid #222; font-size: 0.65rem; text-transform: uppercase; 
      cursor: pointer; border-radius: 2rem; font-weight: 500; transition: 0.2s; letter-spacing: 1px;
    }
    .btn-util:hover { color: #fff; border-color: var(--platinum); }

    .status-bar { font-size: 0.55rem; color: #444; margin-top: 1.5rem; display: flex; justify-content: space-between; border-top: 1px solid #111; padding-top: 1rem; letter-spacing: 2px; text-transform: uppercase; }
    #status { font-weight: 600; color: var(--silver); }
    
    /* Hasil Dekripsi */
    #contentReveal {
      margin-top: 1.2rem; padding: 1.5rem; 
      background: #000; border: 1px solid var(--platinum); border-radius: 1rem; display: none;
      white-space: pre-wrap; font-size: 1rem; font-weight: 400; line-height: 1.6; 
      color: var(--platinum); word-break: break-word;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.03), 0 10px 20px rgba(0,0,0,0.5);
    }

    /* ===== MODAL & TOAST ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 2000; display: none; align-items: center; justify-content: center; }
    .modal-card { width: min(90%, 360px); background: #050505; border: 1px solid #333; border-radius: 1.5rem; padding: 2rem 1.5rem; box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05); text-align: center; }
    .modal-icon { font-size: 2rem; margin-bottom: 0.5rem; }
    .modal-title { color: var(--platinum); font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif, serif; font-size: 1.2rem; font-weight: 600; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 0.8rem; }
    .modal-message { color: var(--silver); font-size: 0.8rem; margin-bottom: 1.5rem; word-break: break-word; line-height: 1.5; }
    .modal-btn { background: transparent; border: 1px solid #333; color: var(--platinum); padding: 0.7rem 2rem; border-radius: 2rem; font-weight: 500; text-transform: uppercase; letter-spacing: 2px; font-size: 0.7rem; cursor: pointer; transition: 0.2s; }
    .modal-btn:hover { border-color: var(--platinum); color: #fff; box-shadow: 0 0 15px rgba(255,255,255,0.1); }
    
    .toast { 
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); 
      background: #0a0a0c; border: 1px solid var(--platinum); border-radius: 3rem; 
      padding: 0.8rem 1.5rem; color: var(--platinum); font-size: 0.7rem; 
      font-weight: 500; text-transform: uppercase; letter-spacing: 2px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.1); 
      z-index: 3000; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; white-space: nowrap; 
    }

    @media (max-width: 500px) { .vault { padding: 1.5rem; } h1 { font-size: 1.5rem; letter-spacing: 4px; } }
  </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="referrer" content="no-referrer" />
</head>
<body>

<div class="modal-overlay" id="modalOverlay" data-click="if(event.target===this)hideModal()">
  <div class="modal-card">
    <div class="modal-icon" id="modalIcon">💎</div>
    <div class="modal-title" id="modalTitle">INFO</div>
    <div class="modal-message" id="modalMessage"></div>
    <button class="modal-btn" data-click="hideModal()">CLOSE</button>
  </div>
</div>

<div class="toast" id="toastMsg">COPIED</div>

<div class="vault">
  <div class="header-ambient"></div>
  <h1>XEVQOR CIPHERLINK</h1>
  <div id="nexusClock">SERVERLESS COMPRESSED</div>

  <div class="main-area">
    <div id="createMode">
      <textarea id="msgBody" placeholder="INSERT SECRET TEXT..."></textarea>
      <div class="pass-wrapper" style="margin-top:12px">
        <input type="password" id="msgPass" class="pass-input" placeholder="MASTER PASSKEY">
        <button class="eye-btn" data-click="togglePass('msgPass', 'eye1')" id="eye1">👁️</button>
      </div>
      <button class="btn-exec" style="margin-top:15px" data-click="generateLink()">GENERATE CIPHERLINK</button>
    </div>

    <div id="readMode" style="display:none;">
      <div class="pass-wrapper">
        <input type="password" id="openPass" class="pass-input" placeholder="DECRYPT KEY">
        <button class="eye-btn" data-click="togglePass('openPass', 'eye2')" id="eye2">👁️</button>
      </div>
      <button class="btn-exec btn-red" style="margin-top:15px" data-click="burnAndShow()">DECRYPT & SCRUB URL</button>
      <div id="contentReveal"></div>
    </div>

    <div id="resultArea">
      <div class="link-box" id="finalURL"></div>
      <div class="action-row">
        <button class="btn-util" style="border-color:var(--platinum); color:var(--platinum)" data-click="copyToClipboard()">COPY LINK</button>
        <button class="btn-util" data-click="location.reload()">NEW CIPHERLINK</button>
      </div>
    </div>
  </div>

  <div class="status-bar">
    <span>COMPRESSION ALGORITHM ACTIVE</span>
    <span id="status">READY</span>
  </div>
</div>

<script>
  // ========== UI HELPERS ==========
  const modal = document.getElementById('modalOverlay');
  function showModal(title, message, icon = '💎') {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('modalIcon').innerText = icon;
    modal.style.display = 'flex';
  }
  function hideModal() { modal.style.display = 'none'; }
  function showToast(text, duration = 2000) {
    const toast = document.getElementById('toastMsg');
    toast.innerText = text; toast.style.opacity = '1';
    setTimeout(() => toast.style.opacity = '0', duration);
  }

  function updateClock() {
    const now = new Date();
    document.getElementById('nexusClock').innerText = now.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }).toUpperCase();
  }
  setInterval(updateClock, 1000); updateClock();

  function togglePass(id, eyeId) {
    const p = document.getElementById(id);
    p.type = p.type === "password" ? "text" : "password";
    document.getElementById(eyeId).innerText = p.type === "password" ? "👁️" : "🔒";
  }

  const hash = window.location.hash.substring(1);
  if (hash) {
    document.getElementById('createMode').style.display = 'none';
    document.getElementById('readMode').style.display = 'block';
    document.querySelector('h1').innerText = "XEVQOR DECRYPTION";
  }

  // ========== COMPRESSION ENGINE ==========
  async function compressData(str) {
    const stream = new Blob([str]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function decompressData(uint8Array) {
    const stream = new Blob([uint8Array]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return await new Response(stream).text();
  }

  // ========== CRYPTO ENGINE (16B SALT + 600K PBKDF2) ==========
  async function deriveKey(p,salt){const enc=new TextEncoder();const km=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:600000,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);}
  async function process(t,p,mode){if(mode==='enc'){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await deriveKey(p,salt),cp=await compressData(t),buf=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,cp),c=new Uint8Array(28+buf.byteLength);c.set(salt,0);c.set(iv,16);c.set(new Uint8Array(buf),28);return btoa((function(b){var s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return s;})(c)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}try{let b=t.replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const c=new Uint8Array(atob(b).split('').map(x=>x.charCodeAt(0)));if(c.length<29)return null;const key=await deriveKey(p,c.slice(0,16)),dec=await crypto.subtle.decrypt({name:"AES-GCM",iv:c.slice(16,28)},key,c.slice(28));return await decompressData(new Uint8Array(dec));}catch(e){return null;}}

  // ========== EXECUTION ==========
  async function generateLink() {
    const txt = document.getElementById('msgBody').value.trim();
    const pass = document.getElementById('msgPass').value.trim();
    if (!txt || !pass) return showModal('INCOMPLETE', 'Both message and passkey are required.', '🔐');
    
    const cipher = await process(txt, pass, 'enc');
    const url = window.location.origin + window.location.pathname + '#' + cipher;
    
    document.getElementById('createMode').style.display = 'none';
    document.getElementById('resultArea').style.display = 'block';
    document.getElementById('finalURL').innerText = url;
    document.querySelector('h1').innerText = "XEVQOR LINK READY";
  }

  async function burnAndShow() {
    const pass = document.getElementById('openPass').value.trim();
    if (!pass) return showModal('KEY REQUIRED', 'Enter the decryption passkey.', '🔑');
    
    const cipher = window.location.hash.substring(1);
    if (!cipher) return showModal('NO DATA', 'No encrypted payload found in URL.', '❌');
    
    const res = await process(cipher, pass, 'dec');
    if (!res) return showModal('ACCESS DENIED', 'Invalid passkey or corrupted data.', '🚫');
    
    const reveal = document.getElementById('contentReveal');
    reveal.innerText = res;
    reveal.style.display = 'block';
    
    // Hapus hash dari URL (Obliterate effect)
    history.replaceState(null, '', window.location.pathname);
    document.getElementById('status').innerText = "URL SCRUBBED";
    document.getElementById('readMode').querySelector('.btn-exec').style.display = 'none';
    document.getElementById('openPass').style.display = 'none';
    document.getElementById('eye2').style.display = 'none';
  }

  function copyToClipboard() {
    const txt = document.getElementById('finalURL').innerText;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(txt).then(() => showToast('🔥 LINK COPIED')).catch(() => fallbackCopy(txt));
    } else fallbackCopy(txt);
  }

  function fallbackCopy(text) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('📋 LINK COPIED');
  }

  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));

(function(){function run(el,code,ev){if(!code)return;if(code==="location.reload()"){location.reload();return;}if(code==="if(event.target===this)hideModal()"){if(ev.target===el){if(window.hideModal)window.hideModal();}return;}var m=code.match(/^([a-zA-Z0-9_]+)\((.*)\)$/);if(!m)return;if(typeof window[m[1]]!=="function")return;var raw=m[2].trim(),args=[];if(raw.length){var parts=raw.split(",");for(var j=0;j<parts.length;j++){var p=parts[j].trim();if(p==="this")args.push(el);else if(/^'.*'$/.test(p))args.push(p.slice(1,-1));else if(/^-?\d+(\.\d+)?$/.test(p))args.push(Number(p));}}window[m[1]].apply(el,args);}document.addEventListener("click",function(e){var t=e.target.closest("[data-click]");if(t)run(t,t.getAttribute("data-click"),e);});document.addEventListener("change",function(e){var t=e.target.closest("[data-change]");if(t)run(t,t.getAttribute("data-change"),e);});})();

(function(){var h=document.querySelector("header,.header,.subtitle,p");if(h&&!document.getElementById("xqr-note")){var d=document.createElement("div");d.id="xqr-note";d.style.cssText="font-size:11px;opacity:.72;margin-top:8px;line-height:1.45;letter-spacing:.3px;";d.textContent="Stateless URL-Fragment Cipher: Encrypted payload stays in # hash (never sent to servers) and is scrubbed from the browser address bar upon decryption — not remote message deletion.";h.insertAdjacentElement("afterend",d);}})();
</script>
</body>
</html>
