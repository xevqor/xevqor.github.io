    :root {

    body { margin: 0; min-height: 100dvh; background: #000000; font-family: 'Montserrat', 'Courier New', monospace; display: flex; align-items: center; justify-content: center; color: #ddd; padding: 15px; box-sizing: border-box; }

    .vault { 
        width: 100%; max-width: 500px; background: var(--card); padding: 25px; 
        border-radius: 1.8rem; border: 1px solid var(--border); 
        box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(255,255,255,0.02);

    .header-ambient { width: 100%; height: 2px; margin-bottom: 20px; background: linear-gradient(90deg, transparent, var(--platinum), var(--ice), var(--platinum), transparent); box-shadow: 0 0 8px rgba(184,199,217,0.4); }

    #xevqorClock { text-align: center; font-size: 9px; color: #6a7a8a; letter-spacing: 1px; margin-top: 8px; font-weight: bold; text-transform: uppercase; }

    .main-area { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }

    .input-box { display: flex; flex-direction: column; gap: 4px; position: relative; }
    .input-box label { font-size: 8px; color: #6a7a8a; letter-spacing: 2px; text-transform: uppercase; font-weight: bold; padding-left: 5px; }

    input { width: 100%; background: #000000; border: 1px solid var(--border); color: var(--ice); padding: 11px; border-radius: 2rem; font-size: 13px; outline: none; box-sizing: border-box; transition: 0.2s; font-family: 'Montserrat', monospace; }
    input:focus { border-color: var(--platinum); box-shadow: 0 0 12px rgba(184,199,217,0.2); }
    
    .pass-input { padding-right: 40px; }

    .eye-btn { position: absolute; right: 16px; bottom: 6px; background: none; border: none; color: #6a7a8a; cursor: pointer; padding: 5px; outline: none; }
    .eye-btn:hover { color: var(--platinum); }

    .dual-results { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 5px; }
    .res-card { 
        background: #000000; border: 1px solid var(--border); padding: 12px 15px; border-radius: 1.2rem; 
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .res-content { flex: 1; text-align: left; overflow: hidden; }
    .res-label { font-size: 8px; color: #6a7a8a; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; display: block; }
    .res-out { color: var(--platinum); font-size: 0.85rem; letter-spacing: 1px; word-break: break-all; font-weight: bold; min-height: 20px; }

    .mini-copy {
        background: #0d0d0f; border: 1px solid var(--border); color: var(--silver);
        padding: 8px; border-radius: 2rem; cursor: pointer; font-size: 9px;
        transition: 0.2s; display: flex; align-items: center; justify-content: center;
        min-width: 45px; height: 35px; text-transform: uppercase; font-weight: bold;
    }
    .mini-copy:hover { border-color: var(--platinum); color: var(--platinum); background: #111418; }
    .mini-copy:active { transform: scale(0.9); }

    button.action-btn { width: 100%; padding: 14px; background: #0d0d0f; border-radius: 2rem; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.2s ease; font-size: 10px; outline: none; border: 1px solid rgba(184,199,217,0.4); margin-top: 5px; }

    .btn-gen { border-color: var(--platinum); color: var(--platinum); }
    .btn-wipe { border-color: #7a5a5a; color: var(--alert); }

    button:hover { background: #111418; color: #fff; }
    .btn-gen:hover { box-shadow: 0 0 14px rgba(184,199,217,0.3); background: rgba(184,199,217,0.1); }
    .btn-wipe:hover { box-shadow: 0 0 12px rgba(255,107,107,0.2); background: rgba(255,107,107,0.1); }

    .footer-status { font-size: 8px; color: #5a6a7a; margin-top: 15px; display: flex; justify-content: space-between; border-top: 1px solid #1a1e22; padding-top: 10px; letter-spacing: 2px; text-transform: uppercase; }
    #status { font-weight: bold; color: var(--platinum); }

<div class="vault">
    <div class="header-ambient"></div>

            <button class="eye-btn" data-click="toggle('m1', 'e1')">

            </button>

            <button class="eye-btn" data-click="toggle('m2', 'e2')">
                <svg id="e2" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-box">
                <label>Identity Label</label>
                <input type="text" id="label1" placeholder="NAME" autocomplete="off">
            </div>
            <div class="input-box">
                <label>Confirm Label</label>

            </div>
        </div>

        <div class="dual-results">
            <div class="res-card">
                <div class="res-content">
                    <span class="res-label">A: Alpha Only (28 Chars)</span>

                <button class="mini-copy" data-click="copy('outA', this)">COPY</button>
            </div>
            <div class="res-card">
                <div class="res-content">
                    <span class="res-label">B: Mixed Symbol (28 Chars)</span>
                    <div id="outB" class="res-out">LOCKED</div>
                </div>
                <button class="mini-copy" data-click="copy('outB', this)">COPY</button>
            </div>
        </div>

        <button class="action-btn btn-gen" data-click="generate()">GENERATE DUAL KEY</button>
        <button class="action-btn btn-wipe" data-click="clearAll()">WIPE MEMORY</button>
    </div>

<script>
    function updateClock() {
        const now = new Date();
        const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let h = now.getHours(), m = String(now.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        const timeStr = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} | ${h}.${m} ${ampm}`;
        document.getElementById('xevqorClock').innerText = timeStr.toUpperCase();
    }
    setInterval(updateClock, 1000); updateClock();

    function updateStatus(msg, color) {
        const s = document.getElementById("status");
        s.innerText = msg;
        s.style.color = color || "#b8c7d9";
    }

    function toggle(id, eyeId) {
        const p = document.getElementById(id), icon = document.getElementById(eyeId);
        if (p.type === "password") {
            p.type = "text";
            icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
        } else {
            p.type = "password";
            icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
        }
    }

    async function generate() {
        const k1 = document.getElementById('m1').value;
        const k2 = document.getElementById('m2').value;
        const l1 = document.getElementById('label1').value.trim().toLowerCase();
        const l2 = document.getElementById('label2').value.trim().toLowerCase();

        if(!k1 || !l1 || !l2) { updateStatus("ALL FIELDS REQUIRED", "#ff6b6b"); return; }
        if(k1 !== k2) { updateStatus("KEYS MISMATCH", "#ff6b6b"); return; }
        if(l1 !== l2) { updateStatus("LABELS MISMATCH", "#ff6b6b"); return; }
        
        updateStatus("MUTATING...", "#b8c7d9");

        try {
            const encoder = new TextEncoder();
            const salt = encoder.encode("xevqor.keypass.v2:" + l1);
            const buf = encoder.encode(k1);
            const bKey = await crypto.subtle.importKey("raw", buf, "PBKDF2", false, ["deriveBits"]);
            const bits = await crypto.subtle.deriveBits({name: "PBKDF2", salt: salt, iterations: 600000, hash: "SHA-256"}, bKey, 1024);
            
            // Base string sekarang di-cut jadi 28 karakter sesuai standar optimal
            let raw = btoa(String.fromCharCode(...new Uint8Array(bits)))
                       .replace(/\+/g, "X")
                       .replace(/\//g, "Z")
                       .replace(/=/g, "Y")
                       .substring(0, 28);

            document.getElementById('outA').innerText = raw;

            const saltB = encoder.encode("xevqor.keypass.v2:slot-b:" + l1);
            const bitsB = await crypto.subtle.deriveBits({name: "PBKDF2", salt: saltB, iterations: 600000, hash: "SHA-256"}, bKey, 1024);
            const alphabetB = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=[]{}|;:,.<>?";
            const bytesB = new Uint8Array(bitsB);
            let outB = "";
            for (let i = 0; i < bytesB.length && outB.length < 28; i++) {
                if (bytesB[i] < 176) {
                    outB += alphabetB[bytesB[i] % 88];
                }
            }
            document.getElementById('outB').innerText = outB;

            updateStatus("DUAL KEY REVEALED", "#6bcf9f");
        } catch (e) { updateStatus("FATAL ERROR", "#ff6b6b"); }
    }

    let clipT=null;async function copy(id,btn){const t=document.getElementById(id).innerText;if(t==="LOCKED")return;if(navigator.clipboard)await navigator.clipboard.writeText(t);else{const d=document.createElement("textarea");document.body.appendChild(d);d.value=t;d.select();document.execCommand("copy");document.body.removeChild(d);}if(clipT)clearTimeout(clipT);clipT=setTimeout(async()=>{try{if(navigator.clipboard&&navigator.clipboard.readText){const c=await navigator.clipboard.readText();if(c===t)await navigator.clipboard.writeText("");}else if(navigator.clipboard){await navigator.clipboard.writeText("");}}catch(e){}},45000);const o=btn.innerText;btn.innerText="DONE!";btn.style.color="#6bcf9f";updateStatus("COPIED (45S WIPE)","#fff");setTimeout(()=>{btn.innerText=o;btn.style.color="#9aaebf";updateStatus("READY","#b8c7d9");},1500);}

    function clearAll() {
        document.getElementById('m1').value = ""; document.getElementById('m2').value = ""; 
        document.getElementById('label1').value = ""; document.getElementById('label2').value = "";
        document.getElementById('outA').innerText = "LOCKED"; document.getElementById('outB').innerText = "LOCKED";
        updateStatus("WIPED", "#ff6b6b"); setTimeout(() => updateStatus("READY", "#b8c7d9"), 1500);
    }

(function(){function run(el,code,ev){if(!code)return;if(code==="location.reload()"){location.reload();return;}if(code==="if(event.target===this)hideModal()"){if(ev.target===el){if(window.hideModal)window.hideModal();}return;}var m=code.match(/^([a-zA-Z0-9_]+)\((.*)\)$/);if(!m)return;if(typeof window[m[1]]!=="function")return;var raw=m[2].trim(),args=[];if(raw.length){var parts=raw.split(",");for(var j=0;j<parts.length;j++){var p=parts[j].trim();if(p==="this")args.push(el);else if(/^'.*'$/.test(p))args.push(p.slice(1,-1));else if(/^-?\d+(\.\d+)?$/.test(p))args.push(Number(p));}}window[m[1]].apply(el,args);}document.addEventListener("click",function(e){var t=e.target.closest("[data-click]");if(t)run(t,t.getAttribute("data-click"),e);});document.addEventListener("change",function(e){var t=e.target.closest("[data-change]");if(t)run(t,t.getAttribute("data-change"),e);});})();

(function(){
  var m1=document.getElementById("m1");
  if(m1&&!document.getElementById("bk-meter")){
    var box=document.createElement("div");box.id="bk-meter";box.style.cssText="margin:8px 0 12px 0;font-size:10px;letter-spacing:.4px;color:#8fa1b5;";
    box.innerHTML='<div style="height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:5px;"><div id="bk-bar" style="height:100%;width:0%;background:#ff6b6b;transition:width .2s,background .2s;"></div></div><div id="bk-txt">BRAIN KEY ENTROPY: 0 BITS — USE 4+ RANDOM WORDS OR 16+ MIXED CHARS</div>';
    var anchor=document.getElementById("m2")?document.getElementById("m2").parentElement:m1.parentElement;
    anchor.insertAdjacentElement("afterend",box);
    var ev=function(){
      var v=m1.value||"",len=v.length,bar=document.getElementById("bk-bar"),txt=document.getElementById("bk-txt");
      if(!len){bar.style.width="0%";bar.style.background="#ff6b6b";txt.style.color="#8fa1b5";txt.textContent="BRAIN KEY ENTROPY: 0 BITS — USE 4+ RANDOM WORDS OR 16+ MIXED CHARS";return;}
      var pool=(/[a-z]/.test(v)?26:0)+(/[A-Z]/.test(v)?26:0)+(/[0-9]/.test(v)?10:0)+(/[^a-zA-Z0-9]/.test(v)?32:0);
      var uniq=new Set(Array.from(v)).size,div=Math.min(1,uniq/len);
      var bits=Math.round(len*Math.log2(Math.max(pool,2))*(0.4+0.6*div));
      bar.style.width=Math.min(100,bits)+"%";
      if(bits<50){bar.style.background="#ff6b6b";txt.style.color="#ff6b6b";txt.textContent="WEAK (~"+bits+" BITS) — VULNERABLE TO OFFLINE GPU CRACKING";}
      else if(bits<80){bar.style.background="#f5b041";txt.style.color="#f5b041";txt.textContent="MODERATE (~"+bits+" BITS) — ADD MORE RANDOM WORDS OR SYMBOLS";}
      else{bar.style.background="#6bcf9f";txt.style.color="#6bcf9f";txt.textContent="STRONG (~"+bits+" BITS) — HIGH RESISTANCE AGAINST OFFLINE BRUTE FORCE";}
    };
    m1.addEventListener("input",ev);
    var wb=document.querySelector(".btn-wipe");if(wb)wb.addEventListener("click",function(){setTimeout(ev,10);});
  }
  var h=document.querySelector("header,.header,.subtitle,p");
  if(h&&!document.getElementById("xqr-note")){
    var d=document.createElement("div");d.id="xqr-note";d.style.cssText="font-size:11px;opacity:.72;margin-top:8px;line-height:1.45;letter-spacing:.3px;";
    d.textContent="Independent PBKDF2-SHA256 (600,000 iterations) derivations for Slot A (62-char alphanumeric map) and Slot B (88-char mixed symbols) using domain-separated salts. Security relies on Brain Key entropy (80+ bits recommended). Best-effort 45s clipboard auto-clear.";
    h.insertAdjacentElement("afterend",d);
  }
})();
</script>
