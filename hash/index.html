<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>XEVQOR HASH · PLATINUM PRECISION</title>

  <!-- PWA Manifest (subfolder hash) -->
  <link rel="manifest" href="./hash/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./hash/icon-192.png">

  <!-- Fonts: Cinzel untuk judul, Montserrat untuk isi -->

  <style>
    :root {
      --bg: #000000;
      --card: #050505;
      --platinum: #e8ebf2;
      --platinum-glow: rgba(220, 225, 240, 0.15);
      --ice: #ffffff;
      --alert: #ff4d4d;
      --ok: #4dff88;
      --silver: #8a8c92;
      --border: #1a1a1c;
      --input-bg: #000000;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: #000000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f5f5f7;
      padding: 15px;
      overflow: auto;
      position: relative;
    }

    /* Ambient glow elegan di belakang card */
    body::before {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: min(100vw, 600px);
      height: min(80vh, 600px);
      background: radial-gradient(ellipse at center, rgba(220, 225, 240, 0.05) 0%, transparent 70%);
      filter: blur(50px);
      z-index: 0;
      pointer-events: none;
    }

    .vault {
      width: 100%;
      max-width: 550px;
      background: var(--card);
      padding: 1.8rem;
      border-radius: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .header-line {
      width: 100%;
      height: 1px;
      margin-bottom: 1.2rem;
      background: linear-gradient(90deg, transparent, var(--platinum), transparent);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    h1 {
      margin: 0;
      font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif, serif;
      font-weight: 500;
      font-size: 2rem;
      letter-spacing: 6px;
      background: linear-gradient(180deg, #ffffff 0%, #a8adb8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      text-transform: uppercase;
    }

    #nexusClock {
      text-align: center;
      font-size: 0.55rem;
      color: var(--silver);
      letter-spacing: 3px;
      margin-top: 8px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .main-area {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    /* File Zone - Neumorphic minimalis */
    .file-zone {
      border: 1px dashed rgba(255, 255, 255, 0.2);
      background: var(--input-bg);
      padding: 1.2rem;
      text-align: center;
      border-radius: 1rem;
      font-size: 0.7rem;
      color: var(--silver);
      cursor: pointer;
      transition: 0.3s ease;
      letter-spacing: 2px;
      font-weight: 500;
      text-transform: uppercase;
    }

    .file-zone:hover {
      border-color: var(--platinum);
      color: var(--platinum);
      box-shadow: 0 0 20px var(--platinum-glow);
    }

    .file-zone.active {
      border-style: solid;
      border-color: var(--platinum);
      color: var(--ice);
      box-shadow: 0 0 20px var(--platinum-glow);
    }

    input[type="file"] {
      display: none;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: var(--input-bg);
      border: 1px solid #222;
      color: var(--platinum);
      padding: 1rem;
      border-radius: 1rem;
      resize: vertical;
      font-size: 0.85rem;
      line-height: 1.5;
      outline: none;
      transition: 0.3s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, monospace;
    }

    textarea::placeholder {
      color: #444;
      font-weight: 300;
      letter-spacing: 1px;
    }

    textarea:focus {
      border-color: var(--platinum);
      box-shadow: 0 0 20px var(--platinum-glow);
    }

    /* Buttons */
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button.action-btn {
      padding: 0.9rem 0.5rem;
      background: transparent;
      border-radius: 2rem;
      font-weight: 500;
      font-size: 0.65rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      transition: 0.3s ease;
      outline: none;
      border: 1px solid #333;
      color: var(--platinum);
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-hash {
      border-color: rgba(255, 255, 255, 0.15) !important;
      color: var(--platinum) !important;
    }

    .btn-hash:hover {
      background: rgba(255, 255, 255, 0.03) !important;
      border-color: var(--platinum) !important;
      color: #fff !important;
      box-shadow: 0 0 20px var(--platinum-glow);
    }

    .action-row {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 5px;
    }

    .btn-copy {
      border-color: rgba(255, 255, 255, 0.1) !important;
      color: var(--silver) !important;
      flex: 1;
    }

    .btn-copy:hover {
      background: rgba(255, 255, 255, 0.03) !important;
      border-color: var(--platinum) !important;
      color: #fff !important;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .btn-wipe {
      border-color: rgba(255, 77, 77, 0.4) !important;
      color: var(--alert) !important;
      flex: 1;
    }

    .btn-wipe:hover {
      background: rgba(255, 77, 77, 0.1) !important;
      border-color: var(--alert) !important;
      color: #fff !important;
      box-shadow: 0 0 20px rgba(255, 77, 77, 0.2);
    }

    .footer-status {
      font-size: 0.55rem;
      color: #444;
      margin-top: 1.5rem;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #111;
      padding-top: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #status {
      font-weight: 600;
      color: var(--silver);
      transition: color 0.2s;
    }

    @media (max-width: 500px) {
      .vault {
        padding: 1.2rem;
      }
      h1 {
        font-size: 1.5rem;
        letter-spacing: 4px;
      }
      button.action-btn {
        font-size: 0.6rem;
        padding: 0.7rem 0;
      }
    }

    /* Scrollbar */
    textarea::-webkit-scrollbar {
      width: 4px;
    }
    textarea::-webkit-scrollbar-thumb {
      background: var(--silver);
      border-radius: 10px;
    }
  </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="referrer" content="no-referrer" />
</head>
<body>

<div class="vault">
  <div class="header-line"></div>
  <h1>XEVQOR HASH</h1>
  <div id="nexusClock">SYNCING...</div>

  <div class="main-area">
    <label for="fileInput" class="file-zone" id="dropZone">
      INSERT FILE
    </label>
    <input type="file" id="fileInput">

    <textarea id="msg" placeholder="INSERT TEXT OR FILE TO HASH..."></textarea>

    <div class="btn-group">
      <button class="action-btn btn-hash" onclick="calculateHash('SHA-256')">SHA-256</button>
      <button class="action-btn btn-hash" onclick="calculateHash('SHA-512')">SHA-512</button>
      <button class="action-btn btn-hash" onclick="calculateHash('SHA-1')">SHA-1</button>
    </div>

    <div class="action-row">
      <button class="action-btn btn-copy" onclick="doCopy()">COPY HASH</button>
      <button class="action-btn btn-wipe" onclick="clearAll()">WIPE</button>
    </div>
  </div>

  <div class="footer-status">
    <span>INTEGRITY PROTOCOL V8.7</span>
    <span id="status">READY</span>
  </div>
</div>

<script>
  let selectedFile = null;
  const fileInput = document.getElementById('fileInput');
  const dropZone = document.getElementById('dropZone');
  const msgEl = document.getElementById('msg');

  function updateClock() {
    const now = new Date();
    const timeStr = now.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('nexusClock').innerText = timeStr.toUpperCase();
  }
  setInterval(updateClock, 1000);
  updateClock();

  function updateStatus(msg, color) {
    const s = document.getElementById("status");
    s.innerText = msg;
    s.style.color = color || "var(--platinum)";
  }

  fileInput.addEventListener('change', function(e) {
    if (this.files && this.files[0]) {
      selectedFile = this.files[0];
      dropZone.innerText = selectedFile.name.toUpperCase();
      dropZone.classList.add('active');
      updateStatus("FILE LOADED", "var(--ice)");
    }
  });

  async function calculateHash(algo) {
    let data;
    updateStatus(`PROCESSING...`, "var(--silver)");
    try {
      if (selectedFile) {
        data = await selectedFile.arrayBuffer();
      } else if (msgEl.value.length > 0) {
        data = new TextEncoder().encode(msgEl.value);
      } else {
        alert("NO INPUT DETECTED.");
        updateStatus("READY", "var(--platinum)");
        return;
      }
      const hashBuffer = await crypto.subtle.digest(algo, data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      msgEl.value = hashHex;
      msgEl.style.color = "var(--ice)";
      updateStatus("HASH SUCCESS", "var(--ok)");
    } catch (e) {
      updateStatus("ERROR", "var(--alert)");
    }
  }

  function doCopy() {
    const text = msgEl.value;
    if (!text) return updateStatus("EMPTY", "var(--alert)");

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => {
        finishCopy();
      }).catch(() => fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    const dummy = document.createElement("textarea");
    document.body.appendChild(dummy);
    dummy.value = text;
    dummy.select();
    try {
      document.execCommand("copy");
      finishCopy();
    } catch (err) {
      updateStatus("FAIL", "var(--alert)");
    }
    document.body.removeChild(dummy);
  }

  function finishCopy() {
    updateStatus("COPIED!", "var(--ice)");
    setTimeout(() => updateStatus("READY", "var(--platinum)"), 2000);
  }

  function clearAll() {
    msgEl.value = "";
    fileInput.value = "";
    selectedFile = null;
    dropZone.innerText = "INSERT FILE";
    dropZone.classList.remove('active');
    msgEl.style.color = "var(--ice)";
    updateStatus("WIPED", "var(--alert)");
    setTimeout(() => updateStatus("READY", "var(--platinum)"), 1500);
  }

  // PWA Service Worker Registration (subfolder ./hash)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('XEVQOR Hash SW registered:', reg))
        .catch(err => console.log('SW error:', err));
    });
  }
</script>
</body>
</html>
