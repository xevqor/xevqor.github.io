<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>XEVQOR RNG - PLATINUM APEX | OBSIDIAN</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./icon-192.png">

<!-- Fonts -->

<style>
    :root { 
        --bg: #000000;
        --card: #050505;
        --platinum: #e8ebf2; 
        --platinum2: #ffffff; 
        --platinum-glow: rgba(220, 225, 240, 0.15); 
        --border: #1a1a1c; 
        --input-bg: #000000;
        --die-metal: linear-gradient(135deg, #ffffff 0%, #e8ebf2 50%, #a8adb8 100%);
        --dot-color: #000000;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    body { 
        margin: 0; min-height: 100dvh; background: #000000; 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, sans-serif; color: #f5f5f7; 
        display: flex; align-items: center; justify-content: center; 
        padding: 15px; overflow: hidden; position: relative;
    }

    /* Ambient glow elegan */
    body::before {
        content: "";
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        width: min(100vw, 600px); height: min(80vh, 600px);
        background: radial-gradient(ellipse at center, rgba(220, 225, 240, 0.05) 0%, transparent 70%);
        filter: blur(50px); z-index: 0; pointer-events: none;
    }
    
    .vault {
        width: 100%; max-width: 500px; height: 95dvh; max-height: 800px;
        background: var(--card); border: 1px solid rgba(255, 255, 255, 0.08); 
        border-radius: 1.5rem; display: flex; flex-direction: column; overflow: hidden; 
        box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05);
        position: relative; z-index: 1;
    }

    .header { padding: 1.8rem 1.5rem 1.2rem; border-bottom: 1px solid #111; text-align: center; background: transparent; position: relative; }
    
    .header-ambient {
        width: 100%; height: 1px; margin-bottom: 1.2rem;
        background: linear-gradient(90deg, transparent, var(--platinum), transparent);
        box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }
    
    h1 { 
        margin: 0; font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif, serif; font-weight: 500; font-size: 1.8rem; letter-spacing: 5px; 
        background: linear-gradient(180deg, #ffffff 0%, #a8adb8 100%);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        text-transform: uppercase; 
    }
    
    #nexusClock { 
        margin-top: 8px; font-size: 0.55rem; color: #8a8c92; 
        letter-spacing: 3px; font-weight: 500; text-transform: uppercase; 
    }

    .controls { padding: 15px; display: flex; gap: 10px; justify-content: center; border-bottom: 1px solid #111; background: transparent; }
    
    .mode-btn { 
        flex: 1; padding: 0.8rem 0; background: transparent; border: 1px solid #333; 
        color: var(--silver); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, sans-serif; font-size: 0.65rem; 
        font-weight: 500; cursor: pointer; border-radius: 2rem; text-transform: uppercase; 
        letter-spacing: 1.5px; transition: 0.3s; 
    }
    
    .mode-btn.active { 
        border-color: var(--platinum); color: var(--platinum); background: rgba(255,255,255,0.03); 
        box-shadow: 0 0 20px var(--platinum-glow); 
    }

    .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; position: relative; }
    
    #gameIndicator { 
        font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif, serif; font-size: 1.8rem; letter-spacing: 8px; font-weight: 600; 
        color: #1a1a1c; height: 45px; text-transform: uppercase; 
        transition: 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67); margin-bottom: 25px; 
    }
    
    .indicator-active { 
        color: var(--platinum2) !important; 
        text-shadow: 0 0 20px var(--platinum-glow), 0 0 5px #fff; 
        transform: scale(1.1); 
    }

    .dice-group-wrapper { perspective: 1000px; display: flex; gap: 30px; justify-content: center; align-items: center; min-height: 100px; }

    .die { width: 65px; height: 65px; position: relative; transform-style: preserve-3d; transition: transform 0.1s linear; }
    
    .die-face { 
        position: absolute; width: 100%; height: 100%; 
        background: var(--die-metal);
        border: 1px solid rgba(255,255,255,0.5); border-radius: 12px; 
        display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 8px; 
        box-shadow: inset 0 0 15px rgba(255,255,255,0.8), 0 10px 20px rgba(0,0,0,0.8);
    }
    
    .dot { width: 11px; height: 11px; background: var(--dot-color); border-radius: 50%; justify-self: center; align-self: center; opacity: 0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); }
    
    .face-1 { transform: translateZ(32.5px); }
    .face-2 { transform: rotateY(180deg) translateZ(32.5px); }
    .face-3 { transform: rotateY(90deg) translateZ(32.5px); }
    .face-4 { transform: rotateY(-90deg) translateZ(32.5px); }
    .face-5 { transform: rotateX(90deg) translateZ(32.5px); }
    .face-6 { transform: rotateX(-90deg) translateZ(32.5px); }

    .face-1 .dot-5 { opacity: 1; }
    .face-2 .dot-1, .face-2 .dot-9 { opacity: 1; }
    .face-3 .dot-1, .face-3 .dot-5, .face-3 .dot-9 { opacity: 1; }
    .face-4 .dot-1, .face-4 .dot-3, .face-4 .dot-7, .face-4 .dot-9 { opacity: 1; }
    .face-5 .dot-1, .face-5 .dot-3, .face-5 .dot-5, .face-5 .dot-7, .face-5 .dot-9 { opacity: 1; }
    .face-6 .dot-1, .face-6 .dot-3, .face-6 .dot-4, .face-6 .dot-6, .face-6 .dot-7, .face-6 .dot-9 { opacity: 1; }

    #totalResult { 
        font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif, serif; font-size: 3.5rem; font-weight: 600; 
        margin-top: 30px; min-height: 60px; letter-spacing: 4px; transition: 0.5s; 
    }
    
    .platinum-glow-text { 
        background: linear-gradient(180deg, #ffffff 0%, #a8adb8 100%); 
        -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        filter: drop-shadow(0 0 15px rgba(255,255,255,0.15)); 
    }

    .action-area { padding: 20px; border-top: 1px solid #111; background: transparent; }
    
    .btn-roll { 
        width: 100%; padding: 1rem; background: transparent; border: 1px solid var(--platinum); 
        color: var(--platinum); border-radius: 2rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, sans-serif; 
        font-weight: 500; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; 
        letter-spacing: 2px; transition: 0.3s; 
    }
    
    .btn-roll:hover { 
        background: rgba(255,255,255,0.03); color: #fff; 
        box-shadow: 0 0 20px var(--platinum-glow); transform: translateY(-2px); 
    }

    .footer { 
        padding: 1rem; font-size: 0.55rem; color: #444; text-align: center; 
        letter-spacing: 2px; border-top: 1px solid #111; 
        padding-bottom: calc(1rem + env(safe-area-inset-bottom)); 
        text-transform: uppercase; font-weight: 500;
    }

    @media (max-height: 700px) {
        .stage { padding: 10px; }
        #totalResult { font-size: 2.5rem; margin-top: 15px; }
        #gameIndicator { margin-bottom: 15px; }
    }
</style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="referrer" content="no-referrer" />
</head>
<body>

<div class="vault">
    <div class="header">
        <div class="header-ambient"></div>
        <h1>XEVQOR RNG</h1>
        <div id="nexusClock" class="nexus-clock">SYNCING...</div>
    </div>

    <div class="controls">
        <button class="mode-btn active" data-click="setDice(1, this)">1 DICE</button>
        <button class="mode-btn" data-click="setDice(2, this)">2 DICE</button>
        <button class="mode-btn" data-click="setDice(3, this)">3 DICE</button>
    </div>

    <div class="stage">
        <div id="gameIndicator">READY</div>
        <div id="diceGroup" class="dice-group-wrapper"></div>
        <div id="totalResult" class="platinum-glow-text"></div>
        <div id="telemetry" style="font-size:0.6rem;color:#8a8c92;letter-spacing:1.5px;margin-top:12px;text-align:center;"></div>
    </div>
    
    <div class="action-area">
        <button class="btn-roll" data-click="rollImpulse()">ROLL SAVAGE RNG</button>
    </div>

    <div class="footer">XEVQOR OBSIDIAN | UNBIASED CSPRNG ENGINE (CSPRNG 3D DICE · SUM · AVG · SHANNON ENTROPY (BITS))</div>
</div>

<script>

    window.__xevDiceHist = window.__xevDiceHist || [];
    function __formatMultiDice(rolls) {
      const n = rolls.length;
      const sum = rolls.reduce((a, b) => a + b, 0);
      const avg = (sum / n).toFixed(2);
      const entropy = (n * Math.log2(6)).toFixed(2);
      window.__xevDiceHist.unshift(sum);
      if (window.__xevDiceHist.length > 5) window.__xevDiceHist.pop();
      const histStr = window.__xevDiceHist.join(" > ");
      return "[ " + rolls.join(" · ") + " ]  |  SUM " + sum + "  ·  AVG " + avg + "  ·  " + entropy + " BITS  |  HIST: " + histStr;
    }
    
    function updateClock() {
        const now = new Date();
        const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
        const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
        let h = now.getHours(), m = String(now.getMinutes()).padStart(2, '0');
        const ampm = h >= 12 ? 'pm' : 'am';
        h = h % 12 || 12;
        const timeStr = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} | ${h}.${m} ${ampm}`;
        document.getElementById('nexusClock').innerText = timeStr.toUpperCase();
    }
    setInterval(updateClock, 1000); updateClock();

    let numDice = 1;
    let isRolling = false;
    const diceGroup = document.getElementById('diceGroup');
    const totalResult = document.getElementById('totalResult');
    const indicator = document.getElementById('gameIndicator');

    const faceRotations = [
        { x: 0, y: 0 }, { x: 0, y: -180 }, { x: 0, y: -90 }, { x: 0, y: 90 }, { x: -90, y: 0 }, { x: 90, y: 0 }
    ];

    function getSavageRoll() {
        const array = new Uint32Array(1);
        window.crypto.getRandomValues(array);
        do { window.crypto.getRandomValues(array); } while (array[0] >= 4294967292);
        return (array[0] % 6) + 1;
    }

    function createDieHTML() {
        let dots = '';
        for(let i=1; i<=9; i++) dots += `<div class="dot dot-${i}"></div>`;
        return `<div class="die">
            <div class="die-face face-1">${dots}</div><div class="die-face face-2">${dots}</div>
            <div class="die-face face-3">${dots}</div><div class="die-face face-4">${dots}</div>
            <div class="die-face face-5">${dots}</div><div class="die-face face-6">${dots}</div>
        </div>`;
    }

    function setDice(n, btn) {
        if(isRolling) return;
        numDice = n;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        diceGroup.innerHTML = '';
        for(let i=0; i<n; i++) { diceGroup.innerHTML += createDieHTML(); }
        totalResult.innerText = '';
        indicator.innerText = 'READY';
        indicator.classList.remove('indicator-active');
    }

    function rollImpulse() {
        if(isRolling) return;
        isRolling = true;
        totalResult.innerText = '';
        indicator.innerText = '...';
        indicator.classList.remove('indicator-active');
        
        const dice = document.querySelectorAll('.die');
        let results = [];
        let total = 0;

        for(let i=0; i<numDice; i++) {
            let res = getSavageRoll();
            results.push(res);
            total += res;
        }

        dice.forEach(die => {
            let randX = Math.random() * 2000 + 1000;
            let randY = Math.random() * 2000 + 1000;
            die.style.transition = 'transform 1.5s cubic-bezier(0.1, 0.8, 0.3, 1)';
            die.style.transform = `rotateX(${randX}deg) rotateY(${randY}deg)`;
        });

        setTimeout(() => {
            dice.forEach((die, index) => {
                let rot = faceRotations[results[index] - 1];
                let curX = parseFloat(die.style.transform.match(/rotateX\((.*?)\)/)[1]);
                let curY = parseFloat(die.style.transform.match(/rotateY\((.*?)\)/)[1]);
                die.style.transition = 'transform 0.5s ease-out';
                die.style.transform = `rotateX(${curX + (360 - curX % 360) + rot.x}deg) rotateY(${curY + (360 - curY % 360) + rot.y}deg)`;
            });

            setTimeout(() => {
                totalResult.innerText = total; const __tel = document.getElementById("telemetry"); if (__tel && typeof __formatMultiDice === "function") __tel.innerText = __formatMultiDice(results);
                
                let status = "";
                if (numDice === 3 && results[0] === results[1] && results[1] === results[2]) {
                    status = '';
                } else {
                    let threshold = (numDice * 6 + numDice) / 2;
                    status = (total >= threshold) ? '' : '';
                }
                
                indicator.innerText = status;
                indicator.classList.add('indicator-active');
                isRolling = false;
            }, 500);
        }, 1500);
    }

    setDice(1, document.querySelector('.mode-btn'));

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('XEVQOR Dice SW registered:', reg))
                .catch(err => console.log('SW error:', err));
        });
    }

(function(){function run(el,code,ev){if(!code)return;if(code==="location.reload()"){location.reload();return;}if(code==="if(event.target===this)hideModal()"){if(ev.target===el){if(window.hideModal)window.hideModal();}return;}var m=code.match(/^([a-zA-Z0-9_]+)\((.*)\)$/);if(!m)return;if(typeof window[m[1]]!=="function")return;var raw=m[2].trim(),args=[];if(raw.length){var parts=raw.split(",");for(var j=0;j<parts.length;j++){var p=parts[j].trim();if(p==="this")args.push(el);else if(/^'.*'$/.test(p))args.push(p.slice(1,-1));else if(/^-?\d+(\.\d+)?$/.test(p))args.push(Number(p));}}window[m[1]].apply(el,args);}document.addEventListener("click",function(e){var t=e.target.closest("[data-click]");if(t)run(t,t.getAttribute("data-click"),e);});document.addEventListener("change",function(e){var t=e.target.closest("[data-change]");if(t)run(t,t.getAttribute("data-change"),e);});})();
</script>
</body>
</html>
