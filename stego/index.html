<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XEVQOR STEGANOGRAPHY | PLATINUM VAULT</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./icon-192.png">

    <!-- Fonts: Cinzel untuk judul, Montserrat untuk isi -->

    <style>
        :root { 
            --platinum: #e8ebf2;
            --silver: #8a8c92;
            --ice: #ffffff;
            --bg: #000000;
            --card: #050505;
            --border: #1a1a1c;
            --text-dim: #444;
            --alert: #ff4d4d;
            --ok: #4dff88;
            --input-bg: #000000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; height: 100dvh; 
            background: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, sans-serif; 
            display: flex; align-items: center; justify-content: center; 
            color: #f5f5f7; padding: 15px; overflow: hidden; position: relative;
        }

        /* Ambient glow elegan di belakang card */
        body::before {
            content: "";
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: min(100vw, 650px); height: min(90vh, 700px);
            background: radial-gradient(ellipse at center, rgba(220, 225, 240, 0.05) 0%, transparent 70%);
            filter: blur(50px); z-index: 0; pointer-events: none;
        }

        .vault { 
            width: 100%; max-width: 600px; height: 90dvh; background: var(--card); padding: 1.8rem; 
            border-radius: 1.5rem; border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.05); 
            display: flex; flex-direction: column; position: relative; overflow-y: auto; scrollbar-width: none; z-index: 1;
        }
        .vault::-webkit-scrollbar { display: none; }

        .header-ambient {
            width: 100%; height: 1px; margin-bottom: 1.2rem;
            background: linear-gradient(90deg, transparent, var(--platinum), transparent);
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        h1 { 
            margin: 0; font-family: 'Cinzel', 'Didot', 'Bodoni MT', 'Palatino Linotype', 'Book Antiqua', Georgia, serif, serif; font-weight: 500; font-size: 1.8rem; letter-spacing: 5px; 
            background: linear-gradient(180deg, #ffffff 0%, #a8adb8 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            text-align: center; text-transform: uppercase; 
        }
        
        #xevqorClock { 
            text-align: center; font-size: 0.55rem; color: var(--silver); letter-spacing: 3px; 
            margin-top: 8px; font-weight: 500; text-transform: uppercase; 
        }

        .mode-switch { display: flex; gap: 10px; margin: 1.5rem 0; }
        
        .mode-btn { 
            flex: 1; padding: 0.9rem; background: transparent; color: var(--silver); 
            border: 1px solid #333; cursor: pointer; text-transform: uppercase; 
            letter-spacing: 1.5px; font-size: 0.65rem; transition: 0.3s; 
            border-radius: 2rem; font-weight: 500; 
        }
        
        .mode-btn.active { 
            border-color: var(--platinum); color: var(--platinum); 
            box-shadow: 0 0 20px rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); 
        }

        .section { 
            margin-bottom: 1rem; padding: 1.2rem; 
            border: 1px solid #222; background: var(--input-bg); 
            border-radius: 1rem; 
        }
        
        .label { 
            font-size: 0.6rem; color: var(--platinum); text-transform: uppercase; 
            letter-spacing: 2px; margin-bottom: 10px; display: block; font-weight: 600; 
        }

        .file-wrapper { position: relative; overflow: hidden; width: 100%; }
        
        .btn-file { 
            border: 1px dashed rgba(255,255,255,0.2); color: var(--silver); 
            background: transparent; padding: 1rem; border-radius: 1rem; 
            font-size: 0.65rem; display: block; text-align: center; cursor: pointer; 
            text-transform: uppercase; font-weight: 500; letter-spacing: 1px; transition: 0.3s; 
        }
        
        .btn-file:hover { 
            border-color: var(--platinum); color: var(--platinum); 
            box-shadow: 0 0 15px var(--platinum-glow); 
        }
        
        .file-wrapper input[type=file] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        input[type="password"], textarea, select { 
            width: 100%; background: var(--input-bg); color: var(--ice); 
            border: 1px solid #222; padding: 1rem; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, monospace; outline: none; 
            border-radius: 1rem; font-size: 0.85rem; transition: 0.3s; 
        }
        
        input:focus, textarea:focus, select:focus { 
            border-color: var(--platinum); box-shadow: 0 0 20px var(--platinum-glow); 
        }
        
        textarea { height: 80px; resize: none; }
        textarea::placeholder, input::placeholder { color: #444; font-weight: 300; letter-spacing: 1px; }

        .pass-wrapper { position: relative; width: 100%; }
        input.pass-input { text-align: center; letter-spacing: 4px; }
        
        .eye-btn { 
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%); 
            background: transparent; border: none; color: var(--silver); cursor: pointer; 
            font-size: 1rem; opacity: 0.5; outline: none; transition: 0.2s; 
        }
        .eye-btn:hover { opacity: 1; color: var(--platinum); }

        .btn-exec { 
            width: 100%; padding: 1rem; background: transparent; 
            border: 1px solid var(--platinum); color: var(--platinum); 
            font-weight: 600; text-transform: uppercase; letter-spacing: 2px; 
            cursor: pointer; transition: 0.3s; border-radius: 2rem; 
            font-size: 0.75rem; margin-top: 10px; outline: none; 
        }
        
        .btn-exec:hover { 
            background: rgba(255,255,255,0.03); box-shadow: 0 0 20px rgba(255,255,255,0.1); 
            transform: translateY(-2px); color: #fff;
        }

        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        
        .btn-util { 
            flex: 1; padding: 0.8rem; background: transparent; color: var(--silver); 
            border: 1px solid #333; font-size: 0.6rem; text-transform: uppercase; 
            cursor: pointer; border-radius: 2rem; font-weight: 500; outline: none; transition: 0.2s; letter-spacing: 1px;
        }
        
        .btn-util:hover { color: var(--alert); border-color: var(--alert); background: rgba(255,77,77,0.1); }
        
        .btn-copy { border-color: rgba(255,255,255,0.1); color: var(--silver); }
        .btn-copy:hover { color: #fff; border-color: var(--platinum); background: rgba(255,255,255,0.03); }

        #status { text-align: center; margin-top: 1.5rem; font-size: 0.55rem; letter-spacing: 2px; color: #444; text-transform: uppercase; font-weight: 600; }
        
        .hidden { display: none !important; }
        
        .file-name-display { font-size: 0.65rem; color: var(--ice); margin-top: 8px; text-align: center; display: block; font-style: italic; }
    </style>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="referrer" content="no-referrer" />
</head>
<body>

<div class="vault">
    <div class="header-ambient"></div>
    <h1>XEVQOR STEGO</h1>
    <div id="xevqorClock">SYNCING CHRONOMETER...</div>

    <div class="mode-switch">
        <button class="mode-btn active" id="btn-hide" data-click="switchMode('hide')">INJECT MODE</button>
        <button class="mode-btn" id="btn-extract" data-click="switchMode('extract')">EXTRACT MODE</button>
    </div>

    <div class="section">
        <span class="label">Step 1: Carrier (Masking File)</span>
        <div class="file-wrapper">
            <span class="btn-file" id="carrierLabel">CHOOSE IMAGE / FILE</span>
            <input type="file" id="carrierFile" data-change="updateFileName('carrierFile', 'carrierLabel', 'fileNameCarrier')">
        </div>
        <span id="fileNameCarrier" class="file-name-display"></span>
    </div>

    <div id="payloadArea" class="section">
        <span class="label">Step 2: Secret Payload</span>
        <select id="payloadType" data-change="updateUI()" style="margin-bottom: 10px;">
            <option value="text">ENCRYPTED TEXT</option>
            <option value="file">HIDDEN FILE</option>
        </select>

        <div id="textInputWrapper">
            <textarea id="payloadText" placeholder="WRITE SECRET MESSAGE HERE..."></textarea>
        </div>

        <div id="fileInputWrapper" class="hidden">
            <div class="file-wrapper">
                <span class="btn-file" id="payloadLabel" style="border-color: var(--platinum); color: var(--platinum);">SELECT PAYLOAD FILE</span>
                <input type="file" id="payloadFile" data-change="updateFileName('payloadFile', 'payloadLabel', 'fileNamePayload')">
            </div>
            <span id="fileNamePayload" class="file-name-display" style="color: var(--platinum);"></span>
        </div>
    </div>

    <div class="section">
        <span class="label">Step 3: Master Vault Key</span>
        <div class="pass-wrapper">
            <input type="password" id="passphrase" class="pass-input" placeholder="ENTER PASSKEY">
            <button class="eye-btn" data-click="togglePass()" id="eyeIcon">👁️</button>
        </div>
    </div>

    <button class="btn-exec" id="execBtn" data-click="process()">EXECUTE INJECTION</button>

    <div class="btn-row">
        <button id="copyBtn" class="btn-util btn-copy hidden" data-click="copyToClipboard()">COPY TEXT</button>
        <button class="btn-util" data-click="wipeSystem()">WIPE SYSTEM</button>
    </div>

    <div id="status">SYSTEM STANDBY</div>
</div>

<script>
    // ========== XEVQOR EOF TRAILER SIGNATURE (8 BYTE) ==========
    const SIG = "XEVQOR88";
    let mode = 'hide';

    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
        document.getElementById('xevqorClock').innerText = timeStr.toUpperCase();
    }
    setInterval(updateClock, 1000); updateClock();

    function togglePass() {
        const p = document.getElementById("passphrase");
        const i = document.getElementById("eyeIcon");
        p.type = p.type === "password" ? "text" : "password";
        i.innerText = p.type === "password" ? "👁️" : "🔒";
    }

    function switchMode(m) {
        mode = m;
        document.getElementById('btn-hide').classList.toggle('active', m === 'hide');
        document.getElementById('btn-extract').classList.toggle('active', m === 'extract');
        document.getElementById('payloadArea').classList.toggle('hidden', m === 'extract');
        document.getElementById('execBtn').innerText = m === 'hide' ? 'EXECUTE INJECTION' : 'EXTRACT & REVEAL';
        document.getElementById('copyBtn').classList.add('hidden');
        updateStatus("READY FOR " + m.toUpperCase());
    }

    function updateUI() {
        const type = document.getElementById('payloadType').value;
        document.getElementById('textInputWrapper').classList.toggle('hidden', type !== 'text');
        document.getElementById('fileInputWrapper').classList.toggle('hidden', type !== 'file');
    }

    function updateFileName(inputId, labelId, displayId) {
        const input = document.getElementById(inputId);
        const display = document.getElementById(displayId);
        if (input.files.length > 0) {
            display.innerText = "LOADED: " + input.files[0].name;
            document.getElementById(labelId).innerText = "CHANGE FILE";
        }
    }

    function updateStatus(msg, color = "#6a7a8a") {
        const s = document.getElementById('status');
        s.innerText = msg; s.style.color = color;
    }

    function copyToClipboard() {
        const text = document.getElementById('payloadText').value;
        if(!text) return updateStatus("NOTHING TO COPY", "#ff6b6b");

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                updateStatus("COPIED TO CLIPBOARD", "#6bcf9f");
            }).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    }

    function fallbackCopy(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";
        textArea.style.top = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            updateStatus("COPIED (XEVQOR BYPASS)", "#6bcf9f");
        } catch (err) {
            updateStatus("COPY FAILED", "#ff6b6b");
        }
        document.body.removeChild(textArea);
    }

    function wipeSystem() {
        if(confirm("WIPE WORKSPACE?")) { location.reload(); }
    }

    async function deriveKey(pass, salt) {
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
        return crypto.subtle.deriveKey(
            { name: "PBKDF2", salt, iterations: 600000, hash: "SHA-256" },
            baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
        );
    }

    async function process() {
        const pass = document.getElementById('passphrase').value;
        const carrier = document.getElementById('carrierFile').files[0];
        if(!pass || !carrier) return alert("MISSING KEY OR CARRIER.");

        try {
            if(mode === 'hide') {
                updateStatus("ENCRYPTING...", "#b8c7d9");
                let pData, meta = {};

                if(document.getElementById('payloadType').value === 'text') {
                    const txt = document.getElementById('payloadText').value;
                    if(!txt) throw new Error("EMPTY MESSAGE");
                    pData = new TextEncoder().encode(txt);
                    meta = { type: 'text' };
                } else {
                    const f = document.getElementById('payloadFile').files[0];
                    if(!f) throw new Error("NO PAYLOAD FILE");
                    pData = new Uint8Array(await f.arrayBuffer());
                    meta = { type: 'file', name: f.name, mime: f.type };
                }

                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await deriveKey(pass, salt);
                const metaEnc = new TextEncoder().encode(JSON.stringify(meta));
                const metaLen = new Uint32Array([metaEnc.byteLength]);
                const combined = new Uint8Array(4 + metaEnc.byteLength + pData.byteLength);
                combined.set(new Uint8Array(metaLen.buffer), 0);
                combined.set(metaEnc, 4);
                combined.set(pData, 4 + metaEnc.byteLength);
                const encrypted = await crypto.subtle.encrypt({name: "AES-GCM", iv}, key, combined);
                const cBytes = new Uint8Array(await carrier.arrayBuffer());

                const sigBytes = new TextEncoder().encode(SIG); 
                const encLenView = new Uint32Array([encrypted.byteLength]);

                const final = new Uint8Array(cBytes.byteLength + 16 + 12 + encrypted.byteLength + 4 + 8);

                let pos = 0;
                final.set(cBytes, pos); pos += cBytes.byteLength;
                final.set(salt, pos); pos += 16;
                final.set(iv, pos); pos += 12;
                final.set(new Uint8Array(encrypted), pos); pos += encrypted.byteLength;
                final.set(new Uint8Array(encLenView.buffer), pos); pos += 4;
                final.set(sigBytes, pos);

                const blob = new Blob([final], {type: carrier.type});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "XEVQOR_" + carrier.name;
                a.click();
                updateStatus("VAULT SECURED", "#6bcf9f");
            } else {
                updateStatus("DECRYPTING...", "#b8c7d9");
                const buf = await carrier.arrayBuffer();
                const L = buf.byteLength;

                const magic = new TextDecoder().decode(buf.slice(L - 8));
                if(magic !== SIG) throw new Error("INVALID XEVQOR SIGNATURE");

                const encLen = new Uint32Array(buf.slice(L - 12, L - 8))[0];
                const encStart = L - 12 - encLen;
                const ivStart = encStart - 12;
                const saltStart = ivStart - 16;

                const salt = new Uint8Array(buf.slice(saltStart, ivStart));
                const iv = new Uint8Array(buf.slice(ivStart, encStart));
                const data = buf.slice(encStart, L - 12);

                const key = await deriveKey(pass, salt);
                const decrypted = await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, data);

                const mLen = new Uint32Array(decrypted.slice(0, 4))[0];
                const meta = JSON.parse(new TextDecoder().decode(decrypted.slice(4, 4 + mLen)));
                const secretData = decrypted.slice(4 + mLen);

                if(meta.type === 'text') {
                    document.getElementById('payloadArea').classList.remove('hidden');
                    document.getElementById('payloadType').value = 'text';
                    updateUI();
                    document.getElementById('payloadText').value = new TextDecoder().decode(secretData);
                    document.getElementById('copyBtn').classList.remove('hidden');
                    updateStatus("MESSAGE REVEALED", "#6bcf9f");
                } else {
                    const blob = new Blob([secretData], {type: meta.mime});
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = "EXTRACTED_" + meta.name;
                    a.click();
                    updateStatus("FILE EXTRACTED", "#6bcf9f");
                }
            }
        } catch (e) {
            console.error(e);
            updateStatus("ACCESS DENIED", "#ff6b6b");
            alert("FAILURE: INCORRECT KEY OR CORRUPTED VAULT.");
        }
    }

    // PWA Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('XEVQOR Stego Engine Online'))
                .catch(err => console.error('Uplink Failed:', err));
        });
    }

(function(){function run(el,code,ev){if(!code)return;if(code==="location.reload()"){location.reload();return;}if(code==="if(event.target===this)hideModal()"){if(ev.target===el){if(window.hideModal)window.hideModal();}return;}var m=code.match(/^([a-zA-Z0-9_]+)\((.*)\)$/);if(!m)return;if(typeof window[m[1]]!=="function")return;var raw=m[2].trim(),args=[];if(raw.length){var parts=raw.split(",");for(var j=0;j<parts.length;j++){var p=parts[j].trim();if(p==="this")args.push(el);else if(/^'.*'$/.test(p))args.push(p.slice(1,-1));else if(/^-?\d+(\.\d+)?$/.test(p))args.push(Number(p));}}window[m[1]].apply(el,args);}document.addEventListener("click",function(e){var t=e.target.closest("[data-click]");if(t)run(t,t.getAttribute("data-click"),e);});document.addEventListener("change",function(e){var t=e.target.closest("[data-change]");if(t)run(t,t.getAttribute("data-change"),e);});})();
</script>
</body>
